{% extends 'khung_chinh.html' %}

{% block tieu_de %}Đổi Mật Khẩu - AutoViet{% endblock %}

{% block noi_dung %}
<div class="row justify-content-center py-4">
  <div class="col-md-6 col-lg-5">
    <div class="card border-0 shadow-sm p-4">
      <h3 class="fw-bold mb-3"><i class="bi bi-shield-lock text-danger me-2"></i>Đổi Mật Khẩu</h3>
      <form method="post" class="d-grid gap-3">
        {% csrf_token %}
        {% for truong in bieu_mau %}
          <div>
            <label class="form-label fw-semibold">{{ truong.label }}</label>
            {{ truong }}
            {% if truong.errors %}
              <div class="text-danger small mt-1">{{ truong.errors|striptags }}</div>
            {% endif %}
          </div>
        {% endfor %}
        <div class="d-flex gap-2 mt-2">
          <button type="submit" class="btn nut-chinh flex-fill">Cập nhật mật khẩu</button>
          <a href="{% url 'tai_khoan:ho_so' %}" class="btn btn-outline-secondary">Quay lại</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
